name: Deploy to IBM Cloud Kubernetes Service

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        run: |
          echo "Build and push a container image to IBM Cloud Container Registry"
      - name: Deploy to IBM Cloud Kubernetes
        run: |
          echo "Configure kubectl with the ${{ secrets.IBMCLOUD_KUBECONFIG }} secret and apply your manifests."
