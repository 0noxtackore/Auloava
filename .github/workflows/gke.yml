name: Build and Deploy to GKE

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  DEPLOYMENT_NAME: gke-deployment
  IMAGE: static-site

jobs:
  setup-build-publish-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Build and push Docker image
        run: |
          gcloud auth configure-docker
          docker build -t gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }} .
          docker push gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }}
      - name: Deploy
        run: |
          kubectl set image deployment/$DEPLOYMENT_NAME $IMAGE=gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }}
