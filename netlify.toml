[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_BASE = "/"
  VITE_USE_FIREBASE = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA: redirige cualquier ruta al index.html (history mode de Vue Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
