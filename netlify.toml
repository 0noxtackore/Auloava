[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_BASE = "/"
  VITE_USE_FIREBASE = "true"

[functions]
  directory = "netlify/functions"

# Publicación automática diaria en redes (reemplaza a n8n).
# Hora en UTC: "0 10 * * *" = 10:00 UTC. Ajusta si quieres otra hora.
[functions.social-scheduler]
  schedule = "0 10 * * *"

# Bandeja de notificaciones de usuarios: "nuevo producto" + recomendación
# del más económico por nicho. Hora en UTC.
[functions.notify-scheduler]
  schedule = "0 9 * * *"

# Auloava no publica recursos agénticos: las rutas ARD responden 404 real
# para que la auditoría ARD de Lighthouse se marque como "No aplica".
# IMPORTANTE: deben ir ANTES que el catch-all SPA (primera regla que coincide).
[[redirects]]
  from = "/.well-known/ai-catalog.json"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.well-known/ard.json"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/ai-catalog.json"
  to = "/404.html"
  status = 404

# SPA: redirige cualquier ruta al index.html (history mode de Vue Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
